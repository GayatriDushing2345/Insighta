openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Insighta API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Businesses
    description: Business profiles and management
  - name: Datasets
    description: Dataset upload and management
  - name: Insights
    description: AI-generated insights
  - name: Queries
    description: AI Q&A on business data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /businesses:
    get:
      tags: [Businesses]
      operationId: listBusinesses
      summary: List all public businesses
      parameters:
        - name: industry
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Business'
    post:
      tags: [Businesses]
      operationId: createBusiness
      summary: Create a business profile (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessBody'
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/{id}:
    get:
      tags: [Businesses]
      operationId: getBusinessById
      summary: Get a business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Business detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Businesses]
      operationId: updateBusiness
      summary: Update a business profile (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessBody'
      responses:
        '200':
          description: Updated business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/my:
    get:
      tags: [Businesses]
      operationId: getMyBusiness
      summary: Get the current user's business
      responses:
        '200':
          description: The user's business or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessOrNull'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/{id}/datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: List datasets for a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
    post:
      tags: [Datasets]
      operationId: uploadDataset
      summary: Upload a dataset (business owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDatasetBody'
      responses:
        '201':
          description: Dataset uploaded and processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/{id}/insights:
    get:
      tags: [Insights]
      operationId: listInsights
      summary: Get AI-generated insights for a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'

  /businesses/{id}/insights/generate:
    post:
      tags: [Insights]
      operationId: generateInsights
      summary: Trigger AI insight generation for a business (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Insights generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/{id}/ask:
    post:
      tags: [Queries]
      operationId: askBusinessQuestion
      summary: Ask an AI question about a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQuestionBody'
      responses:
        '200':
          description: AI answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /businesses/{id}/queries:
    get:
      tags: [Queries]
      operationId: listQueries
      summary: List past Q&A for a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryResult'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Business:
      type: object
      required: [id, ownerId, name, industry, description, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: string
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
        datasetCount:
          type: integer
        insightCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    BusinessDetail:
      type: object
      required: [id, ownerId, name, industry, description, createdAt, datasets, insights]
      properties:
        id:
          type: integer
        ownerId:
          type: string
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'

    BusinessOrNull:
      type: object
      required: [business]
      properties:
        business:
          oneOf:
            - $ref: '#/components/schemas/Business'
            - type: 'null'

    CreateBusinessBody:
      type: object
      required: [name, industry, description]
      properties:
        name:
          type: string
          minLength: 1
        industry:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        website:
          type: string

    UpdateBusinessBody:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: string

    Dataset:
      type: object
      required: [id, businessId, name, fileType, status, rowCount, createdAt]
      properties:
        id:
          type: integer
        businessId:
          type: integer
        name:
          type: string
        fileType:
          type: string
        status:
          type: string
          enum: [pending, processing, ready, failed]
        rowCount:
          type: integer
        columns:
          type: [string, 'null']
        summary:
          type: [string, 'null']
        statistics:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    UploadDatasetBody:
      type: object
      required: [name, fileType, data]
      properties:
        name:
          type: string
          minLength: 1
        fileType:
          type: string
          enum: [csv, json]
        data:
          type: string
          description: Raw CSV or JSON string content

    Insight:
      type: object
      required: [id, businessId, type, title, content, createdAt]
      properties:
        id:
          type: integer
        businessId:
          type: integer
        datasetId:
          type: [integer, 'null']
        type:
          type: string
          enum: [summary, growth, risk, opportunity, trend]
        title:
          type: string
        content:
          type: string
        metrics:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    AskQuestionBody:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1

    QueryResult:
      type: object
      required: [id, businessId, question, answer, createdAt]
      properties:
        id:
          type: integer
        businessId:
          type: integer
        userId:
          type: [string, 'null']
        question:
          type: string
        answer:
          type: string
        sources:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
